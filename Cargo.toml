[workspace]
resolver = "3"
members = ["crates/app", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tangge233/PCL-Anywhere"

[workspace.dependencies]
gpui-kit = "0.7"
pcl-ui = { path = "crates/ui" }
# JSON 解析：界面层在构建期解析文案表，后续其他模块也会用到。
serde_json = "1.0"
# 实例数据表：界面线程与将来的后台扫描共用一张表，按分片加锁。
dashmap = "6"

# 发版产物：去掉符号并做薄 LTO，二进制体积与启动都更稳。
[profile.release]
strip = true
lto = "thin"
