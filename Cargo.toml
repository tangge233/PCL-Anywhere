[workspace]
resolver = "3"
members = ["crates/app", "crates/ui", "crates/logger", "crates/lite-config"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tangge233/PCL-Anywhere"

[workspace.dependencies]
pcl-ui = { path = "crates/ui" }
logger = { path = "crates/logger" }

# Common
dashmap = "6"
thiserror = "2"
chrono = "0.4"

# UI
gpui-kit = "0.7"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.25", features = ["serde"] }
atomic-write-file = "0.3"
arc-swap = "1"

# Logger
log = "0.4"
flexi_logger = { version = "0.31", default-features = false }

# Allocator
# Linux jemalloc / OSX default / Windows mimalloc
tikv-jemallocator = "0.7"
mimalloc = "0.1"

[profile.release]
strip = true
lto = "thin"
