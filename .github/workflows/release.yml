name: Release

# 推送 v* tag 即发版：各平台构建 release 产物并打包为 tar.gz，随后一次性发布。
#
# 发布用 softprops/action-gh-release（固定到 v3.0.3 的提交 SHA）。仓库启用了 Immutable Release，
# 发布后资产不可再修改，因此按该 action 的说明区分两种情形：
#   - 正式版：action 先上传资产再发布，天然满足「资产就位后才发布」；
#   - 预发布：默认会直接发布，资产会被锁住，故用 draft: true 先建草稿并上传，
#     之后由维护者手动把草稿发布出去（下游若订阅 release.published 仍会触发）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发版的 tag（须已存在；留空则使用当前 ref）
        required: false
        type: string
      dry_run:
        description: 只构建与打包，不创建 Release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan-dev libssl-dev

      - name: Build and run tests
        run: |
          cargo test -p pcl-ui
          cargo build --release -p pcl-app

      - name: Archive ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p dist/${{ matrix.rid }}
          cp target/release/pcl-app dist/${{ matrix.rid }}/
          cp LICENSE README.md dist/${{ matrix.rid }}/
          tar -C dist -czf PCL-Anywhere-${{ matrix.rid }}.tar.gz ${{ matrix.rid }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL-Anywhere-${{ matrix.rid }}
          path: PCL-Anywhere-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history and tags for git-cliff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag and release kind
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 与 gh release create --verify-tag 一致：tag 必须已存在，action 不应替我们建 tag
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "::error::tag $TAG 不存在"; exit 1; }

          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          # 预发布 tag（v1.2.3-beta.1 之类）：Immutable Release 下先落草稿，资产上传后再发布
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT"
                 echo "draft=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT"
                 echo "draft=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install git-cliff
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff --latest --output CHANGELOG.md

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: PCL-Anywhere-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.name }}
          name: ${{ steps.release.outputs.name }}
          body_path: CHANGELOG.md
          draft: ${{ steps.release.outputs.draft }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: dist/*.tar.gz
          # 缺产物时直接失败：Immutable Release 无法在发布后补资产
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: publish lite-config
    needs: [build, release] # 确保构建可用
    # 预发布，不推送
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p lite-config --locked
