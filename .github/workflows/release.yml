name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 版本名（如 v0.1.0）
        required: true
        type: string
      release_type:
        description: 发布类型（Beta / Alpha 为预发布）
        required: true
        type: choice
        options:
          - Release
          - Beta
          - Alpha
        default: Release

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version_name }}
  cancel-in-progress: false

jobs:
  build-unix:
    name: build-unix-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan-dev libssl-dev

      - name: Test
        # UI 集成测试目前只在 Linux 上验证；macOS 先只做构建，与 ci.yml 的 macOS build 保持一致。
        if: runner.os == 'Linux'
        run: cargo test -p na-ui

      - name: Build
        run: cargo build --release -p na-app

      - name: Archive ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p dist/${{ matrix.rid }}
          cp target/release/na-app dist/${{ matrix.rid }}/
          cp LICENSE README.md dist/${{ matrix.rid }}/
          tar -C dist -czf Neko-Anywhere-${{ matrix.rid }}.tar.gz ${{ matrix.rid }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Neko-Anywhere-${{ matrix.rid }}
          path: Neko-Anywhere-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: build-windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: cargo build --release -p na-app

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows-x64
          cp target/release/na-app.exe dist/windows-x64/
          cp LICENSE README.md dist/windows-x64/
          tar -C dist -czf Neko-Anywhere-windows-x64.tar.gz windows-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Neko-Anywhere-windows-x64
          path: Neko-Anywhere-windows-x64.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history and tags for git-cliff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag current commit for git-cliff
        run: git tag "${{ inputs.version_name }}"

      - name: Install git-cliff
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff --latest --output CHANGELOG.md

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Neko-Anywhere-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version_name }}
          name: ${{ inputs.version_name }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          prerelease: ${{ inputs.release_type != 'Release' }}
          files: dist/*.tar.gz
          # 缺产物时直接失败：Immutable Release 无法在发布后补资产
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: publish lite-config
    needs: [release]
    # 只有 Release 类型发布 crate；Beta / Alpha 不推送。
    if: ${{ inputs.release_type == 'Release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p lite-config --locked
