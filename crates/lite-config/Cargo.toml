[package]
name = "lite-config"
description = "Simple config file management"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true

[dependencies]
# 编解码用 `to_string_pretty`（出 `[section]` 而不是行内表），迁移用 `DocumentMut`。
toml_edit.workspace = true
serde.workspace = true
arc-swap.workspace = true
atomic-write-file.workspace = true
thiserror.workspace = true

[dev-dependencies]
# 测试用临时目录；每个测试一份，互不干扰。
tempfile = "3"
